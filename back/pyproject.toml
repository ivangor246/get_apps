[project]
name = "get_apps"
version = "0.1.0"
description = ""
authors = [
    {name = "ivangor246",email = "ivangor246@gmail.com"}
]

requires-python = ">=3.14"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "app", from = "src" }
]

[tool.poetry.dependencies]
beautifulsoup4 = "^4.14.3"
lxml = "^6.0.4"
playwright = "^1.50.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
aiosqlite = "^0.20.0"
httpx = "^0.28.1"
chromadb = "^0.5.20"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
tokenizers = "^0.22.2"
fastembed = "^0.8.0"


[tool.poetry.group.dev.dependencies]
ruff = "^0.15.0"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["C", "E", "F", "W"]

[tool.ruff.format]
quote-style = "single"