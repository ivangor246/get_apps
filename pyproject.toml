[project]
name = "get_apps"
version = "0.1.0"
description = ""
authors = [
    {name = "ivangor246",email = "ivangor246@gmail.com"}
]

requires-python = ">=3.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "app", from = "src" }
]

[tool.poetry.dependencies]
beautifulsoup4 = "^4.14.3"
httpx = "^0.28.1"
lxml = "^6.0.4"


[tool.poetry.group.dev.dependencies]
ruff = "^0.15.0"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["C", "E", "F", "W"]

[tool.ruff.format]
quote-style = "single"